<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x0s | workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:#000; --accent:#fff; --card:#0a0a0a; --border:#1a1a1a;
            --code-cyan:#00d2ff; --glass:rgba(255,255,255,0.03);
            --blue:#007aff; --red:#ff453a; --green:#30d158; --yellow:#ffd60a; --purple:#af52de;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Space Grotesk',sans-serif;margin:0;padding:0;}
        body{background:var(--bg);color:var(--accent);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

        header{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
        .brand{font-weight:700;letter-spacing:-1px;font-size:1.1rem;}
        .version{font-size:8px;opacity:0.3;letter-spacing:2px;}

        .lang-bar{display:flex;gap:6px;padding:6px 16px 4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
        .lang-bar::-webkit-scrollbar{display:none;}
        .lang-chip{background:var(--card);border:1px solid var(--border);color:#555;padding:6px 14px;border-radius:50px;font-size:0.7rem;font-weight:600;cursor:pointer;transition:0.25s;white-space:nowrap;flex-shrink:0;}
        .lang-chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}

        .tab-nav{display:flex;gap:6px;padding:6px 16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
        .tab-nav::-webkit-scrollbar{display:none;}
        .tab-trigger{background:var(--card);border:1px solid var(--border);color:#555;padding:9px 18px;border-radius:50px;font-size:0.73rem;font-weight:600;cursor:pointer;transition:0.25s;white-space:nowrap;flex-shrink:0;}
        .tab-trigger.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}

        .stage{flex:1;position:relative;min-height:0;margin-bottom:110px;}
        .view{position:absolute;inset:0 12px;opacity:0;transform:scale(0.98);pointer-events:none;transition:0.35s cubic-bezier(0.2,0.8,0.2,1);display:flex;}
        .view.active{opacity:1;transform:scale(1);pointer-events:all;}

        .editor-wrap{background:var(--card);border:1px solid var(--border);border-radius:26px;width:100%;overflow:hidden;display:flex;flex-direction:column;}
        .editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;border-bottom:1px solid var(--border);}
        .editor-lang-badge{font-size:0.65rem;font-weight:700;letter-spacing:1px;opacity:0.5;}
        .line-count{font-size:0.65rem;opacity:0.3;font-family:'Fira Code',monospace;}
        textarea{width:100%;flex:1;background:transparent;border:none;color:var(--code-cyan);padding:16px 20px;font-family:'Fira Code',monospace;font-size:12.5px;line-height:1.7;outline:none;resize:none;overflow:auto;tab-size:2;}

        #view-live iframe,#view-mobile iframe{width:100%;height:100%;border:none;background:white;}
        #view-live{border-radius:26px;overflow:hidden;border:1px solid var(--border);}

        .output-panel{width:100%;height:100%;background:var(--card);border-radius:26px;border:1px solid var(--border);overflow:auto;padding:20px;font-family:'Fira Code',monospace;font-size:12.5px;line-height:1.7;color:var(--green);white-space:pre-wrap;}
        .output-panel .err{color:var(--red);}
        .output-panel .info{color:#aaa;}

        .phone-container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;}
        .phone-frame{width:345px;height:700px;background:#000;border:10px solid #141414;border-radius:52px;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,0.9);flex-shrink:0;}
        .status-bar{position:absolute;top:0;left:0;width:100%;height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:11px;z-index:11;color:white;background:black;}
        .phone-frame iframe{width:100%;height:100%;border:none;background:white;padding-top:32px;}

        .history-view{width:100%;height:100%;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;}
        .history-view::-webkit-scrollbar{display:none;}
        .history-item{background:var(--card);border:1px solid var(--border);padding:14px 16px;border-radius:22px;display:flex;align-items:center;gap:12px;position:relative;}
        .hist-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;}
        .hist-info{flex:1;min-width:0;}
        .hist-name{font-weight:600;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .hist-meta{font-size:0.68rem;color:#555;margin-top:2px;}
        .hist-three-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#555;font-size:0.9rem;flex-shrink:0;}
        .hist-three-dot:hover{background:rgba(255,255,255,0.06);color:#fff;}

        /* CTX MENU */
        .ctx-menu{position:fixed;background:#111;border:1px solid #222;border-radius:18px;padding:6px;z-index:9000;min-width:200px;box-shadow:0 20px 60px rgba(0,0,0,0.95);animation:ctxIn 0.18s cubic-bezier(0.2,0.8,0.2,1);}
        @keyframes ctxIn{from{opacity:0;transform:scale(0.9) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
        .ctx-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:0.15s;}
        .ctx-item:hover{background:rgba(255,255,255,0.07);}
        .ctx-item i{width:16px;text-align:center;}
        .ctx-item.danger{color:var(--red);}
        .ctx-sep{height:1px;background:var(--border);margin:4px 0;}

        /* REPO CREATE MODAL */
        #repo-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);display:none;align-items:flex-end;justify-content:center;z-index:4000;}
        #repo-modal.show{display:flex;}
        .repo-sheet{background:#0d0d0d;border:1px solid var(--border);border-radius:36px 36px 0 0;width:100%;max-width:520px;padding:28px 20px 40px;animation:sheetUp 0.4s cubic-bezier(0.32,0.72,0,1);max-height:88vh;overflow-y:auto;scrollbar-width:none;}
        .repo-sheet::-webkit-scrollbar{display:none;}
        @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
        .repo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
        .repo-title{font-size:1rem;font-weight:700;}
        .repo-close{width:32px;height:32px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#aaa;}
        .repo-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:14px 18px;border-radius:18px;color:white;outline:none;font-size:0.85rem;font-family:'Space Grotesk',sans-serif;margin-bottom:12px;}
        .repo-input::placeholder{color:#333;}
        .file-selector{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:200px;overflow-y:auto;scrollbar-width:none;}
        .file-selector::-webkit-scrollbar{display:none;}
        .file-check-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:0.2s;}
        .file-check-item.selected{border-color:var(--blue);background:rgba(0,122,255,0.08);}
        .file-check-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;}
        .file-check-name{flex:1;font-size:0.8rem;font-weight:600;}
        .file-check-cb{width:20px;height:20px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .file-check-item.selected .file-check-cb{background:var(--blue);border-color:var(--blue);}
        .section-label{font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:#444;margin-bottom:8px;}

        /* REPO VIEWER — full screen */
        #repo-viewer{position:fixed;inset:0;background:#000;z-index:5000;display:none;flex-direction:column;}
        #repo-viewer.show{display:flex;}
        .rv-topbar{padding:16px 20px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;background:#000;}
        .rv-back{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
        .rv-name{font-weight:700;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

        /* REPO TABS inside viewer */
        .rv-tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
        .rv-tabs::-webkit-scrollbar{display:none;}
        .rv-tab{background:transparent;border:1px solid transparent;color:#555;padding:7px 16px;border-radius:50px;font-size:0.72rem;font-weight:600;cursor:pointer;transition:0.2s;white-space:nowrap;}
        .rv-tab.active{background:var(--card);border-color:var(--border);color:#fff;}

        /* REPO BODY */
        .rv-body{flex:1;overflow-y:auto;scrollbar-width:none;}
        .rv-body::-webkit-scrollbar{display:none;}

        /* REPO — files tab */
        .rv-files-wrap{padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
        .rv-file-row{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:13px 14px;display:flex;align-items:center;gap:12px;}
        .rv-file-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;flex-shrink:0;}
        .rv-file-info{flex:1;min-width:0;}
        .rv-file-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .rv-file-meta{font-size:0.67rem;color:#555;margin-top:2px;}
        .rv-file-actions{display:flex;gap:6px;flex-shrink:0;}
        .rv-action-btn{width:30px;height:30px;border-radius:10px;background:#111;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.75rem;color:#aaa;transition:0.2s;}
        .rv-action-btn:hover{background:#1a1a1a;color:#fff;}
        .rv-action-btn.deploy{background:rgba(0,122,255,0.15);color:var(--blue);border-color:rgba(0,122,255,0.3);}
        .rv-action-btn.deploy:hover{background:var(--blue);color:#fff;}
        .rv-action-btn.danger:hover{background:rgba(255,69,58,0.2);color:var(--red);}

        /* RENAME INLINE */
        .rv-rename-input{background:transparent;border:none;border-bottom:1px solid var(--blue);color:#fff;font-size:0.82rem;font-weight:600;font-family:'Space Grotesk',sans-serif;outline:none;width:100%;}

        /* UPLOAD DROP ZONE in viewer */
        .rv-upload-zone{margin:12px 16px;border:1.5px dashed #222;border-radius:20px;padding:24px;text-align:center;color:#333;font-size:0.78rem;cursor:pointer;transition:0.2s;}
        .rv-upload-zone:hover{border-color:#444;color:#666;}
        .rv-upload-zone i{display:block;font-size:1.6rem;margin-bottom:8px;}

        /* STATS row */
        .rv-stats{display:flex;gap:8px;padding:12px 16px 4px;flex-wrap:wrap;}
        .rv-stat{background:var(--card);border:1px solid var(--border);border-radius:50px;padding:6px 14px;font-size:0.7rem;display:flex;align-items:center;gap:6px;color:#666;}

        /* MEDIA GRID */
        .rv-media-wrap{padding:12px 16px;}
        .rv-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
        .rv-media-cell{aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid var(--border);cursor:pointer;position:relative;background:#111;}
        .rv-media-cell img{width:100%;height:100%;object-fit:cover;}
        .rv-media-cell .play-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:rgba(255,255,255,0.7);}
        .rv-media-del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:var(--red);cursor:pointer;}

        /* DEPLOY PREVIEW overlay inside repo */
        #rv-deploy-overlay{position:absolute;inset:0;background:#000;z-index:100;display:none;flex-direction:column;}
        #rv-deploy-overlay.show{display:flex;}
        .rv-deploy-bar{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
        .rv-deploy-title{flex:1;font-size:0.85rem;font-weight:600;}
        .rv-deploy-tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
        .rv-deploy-tab{background:transparent;border:1px solid transparent;color:#555;padding:7px 16px;border-radius:50px;font-size:0.72rem;font-weight:600;cursor:pointer;transition:0.2s;white-space:nowrap;}
        .rv-deploy-tab.active{background:var(--card);border-color:var(--border);color:#fff;}
        .rv-deploy-body{flex:1;position:relative;min-height:0;}
        .rv-deploy-frame{position:absolute;inset:0;width:100%;height:100%;border:none;}
        .rv-deploy-phone{display:flex;align-items:center;justify-content:center;height:100%;}

        /* MEDIA PREVIEW */
        #media-preview{position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:8000;display:none;align-items:center;justify-content:center;flex-direction:column;}
        #media-preview.show{display:flex;}
        #media-preview img,#media-preview video{max-width:92vw;max-height:78vh;border-radius:18px;object-fit:contain;}
        .media-close{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .media-filename{margin-top:12px;font-size:0.78rem;color:#555;}

        /* UPLOAD ZONE in create modal */
        .upload-zone{border:1.5px dashed #222;border-radius:18px;padding:18px;text-align:center;color:#333;font-size:0.78rem;cursor:pointer;transition:0.2s;margin-bottom:12px;}
        .upload-zone:hover{border-color:#444;color:#666;}
        .upload-zone i{display:block;font-size:1.4rem;margin-bottom:6px;}
        .media-thumb-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
        .media-thumb{width:62px;height:62px;border-radius:12px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
        .media-thumb-video{width:62px;height:62px;border-radius:12px;background:#111;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#555;cursor:pointer;font-size:1.1rem;}

        /* DOCK */
        .dock-container{position:fixed;bottom:30px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:8px;z-index:100;}
        .circle-btn{width:50px;height:50px;background:var(--card);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;font-size:0.85rem;flex-shrink:0;}
        .dock{background:rgba(12,12,12,0.88);backdrop-filter:blur(22px);border:1px solid var(--border);padding:6px;border-radius:60px;display:flex;gap:4px;}
        .btn{background:transparent;border:none;color:white;padding:11px 20px;border-radius:50px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:0.2s;font-family:'Space Grotesk',sans-serif;}
        .btn:hover{background:rgba(255,255,255,0.06);}
        .btn-primary{background:var(--accent);color:var(--bg);}
        .btn-primary:hover{background:#ddd;}

        /* SAVE PORTAL */
        #portal{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;z-index:2000;}
        #portal.show{display:flex;}
        .portal-box{background:#0d0d0d;border:1px solid var(--border);padding:36px 28px;border-radius:36px;width:90%;max-width:320px;text-align:center;}
        .portal-box h2{margin-bottom:8px;font-size:1.1rem;}
        .portal-box p{font-size:0.75rem;color:#444;margin-bottom:20px;}
        input[type="text"]{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:14px;border-radius:18px;color:white;margin-bottom:12px;text-align:center;outline:none;font-size:0.85rem;font-family:'Space Grotesk',sans-serif;}
        .ext-badge{display:inline-block;background:rgba(0,122,255,0.15);color:var(--blue);border-radius:8px;padding:3px 10px;font-size:0.68rem;font-weight:700;margin-bottom:14px;}

        /* TOAST */
        .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);background:#111;border:1px solid #222;color:white;padding:10px 22px;border-radius:50px;font-size:0.78rem;font-weight:600;z-index:9999;transition:0.35s cubic-bezier(0.32,0.72,0,1);white-space:nowrap;pointer-events:none;}
        .toast.show{transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>

<header>
    <div class="brand">x0s <span style="font-weight:300;opacity:0.4;">Workspace</span></div>
    <div class="version">V2_REPO</div>
</header>

<div class="lang-bar" id="langBar"></div>

<div class="tab-nav">
    <button id="tab-code" class="tab-trigger active" onclick="show('code',this)">Architecture</button>
    <button id="tab-live" class="tab-trigger" onclick="show('live',this)">Live View</button>
    <button id="tab-mobile" class="tab-trigger" onclick="show('mobile',this)">Mobile View</button>
    <button id="tab-history" class="tab-trigger" onclick="show('history',this)">Build History</button>
</div>

<main class="stage">
    <div id="view-code" class="view active">
        <div class="editor-wrap">
            <div class="editor-toolbar">
                <span class="editor-lang-badge" id="langBadge">HTML</span>
                <span class="line-count" id="lineCount">0 lines</span>
            </div>
            <textarea id="main-editor" spellcheck="false" placeholder="// Start building..." oninput="onEditorInput()"></textarea>
        </div>
    </div>
    <div id="view-live" class="view"><iframe id="live-frame"></iframe></div>
    <div id="view-mobile" class="view">
        <div class="phone-container">
            <div class="phone-frame">
                <div class="status-bar">
                    <div id="phone-time">00:00</div>
                    <div style="display:flex;gap:5px;"><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-signal"></i><i class="fa-solid fa-battery-full"></i></div>
                </div>
                <iframe id="mobile-frame"></iframe>
            </div>
        </div>
    </div>
    <div id="view-output" class="view">
        <div class="output-panel" id="outputPanel"><span class="info">// Run your code to see output here</span></div>
    </div>
    <div id="view-history" class="view">
        <div id="history-list" class="history-view"></div>
    </div>
</main>

<div class="dock-container">
    <div class="circle-btn" onclick="document.getElementById('file-upload').click()"><i class="fa-solid fa-cloud-arrow-up"></i></div>
    <input type="file" id="file-upload" hidden onchange="handleFileUpload(this)">
    <div class="dock">
        <button id="action-btn" class="btn" onclick="handleAction()">Paste</button>
        <button class="btn" onclick="openPortal()">Save</button>
        <button class="btn btn-primary" onclick="runCode()">Deploy</button>
    </div>
</div>

<!-- SAVE PORTAL -->
<div id="portal">
    <div class="portal-box">
        <h2>Commit Build</h2>
        <p>Name this file — extension auto-applied</p>
        <input type="text" id="file-name" placeholder="x0s_core_index" autocomplete="off">
        <div class="ext-badge" id="ext-badge">.html</div><br>
        <div style="display:flex;gap:10px;margin-top:8px;">
            <button class="btn" style="flex:1;border:1px solid var(--border);" onclick="closePortal()">Abort</button>
            <button class="btn btn-primary" style="flex:2;" onclick="saveFile()">Confirm</button>
        </div>
    </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu" style="display:none;"></div>

<!-- REPO CREATE MODAL -->
<div id="repo-modal">
    <div class="repo-sheet">
        <div class="repo-header">
            <div class="repo-title"><i class="fa-solid fa-code-branch" style="color:var(--blue);margin-right:8px;"></i>Quick Repo</div>
            <div class="repo-close" onclick="closeRepoModal()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="section-label">REPO NAME</div>
        <input type="text" class="repo-input" id="repoName" placeholder="my-project-v1">
        <div class="section-label">DESCRIPTION</div>
        <input type="text" class="repo-input" id="repoDesc" placeholder="What does this repo contain?">
        <div class="section-label">SELECT FILES</div>
        <div class="file-selector" id="fileSelector"></div>
        <div class="section-label">MEDIA</div>
        <div class="upload-zone" onclick="document.getElementById('repo-media-upload').click()">
            <i class="fa-solid fa-photo-film"></i>Add photos or videos
        </div>
        <input type="file" id="repo-media-upload" hidden accept="image/*,video/*" multiple onchange="handleRepoMedia(this)">
        <div class="media-thumb-list" id="repoMediaThumbs"></div>
        <button class="btn btn-primary" style="width:100%;padding:14px;border-radius:18px;font-size:0.88rem;" onclick="createRepo()">
            <i class="fa-solid fa-plus" style="margin-right:6px;"></i>Create Repo
        </button>
    </div>
</div>

<!-- REPO VIEWER -->
<div id="repo-viewer">
    <div class="rv-topbar">
        <div class="rv-back" onclick="closeRepoViewer()"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="rv-name" id="rvName">—</div>
        <div style="display:flex;gap:8px;">
            <div class="rv-back" title="Upload file to repo" onclick="document.getElementById('rv-file-upload').click()" style="background:rgba(0,122,255,0.12);border-color:rgba(0,122,255,0.3);color:var(--blue);"><i class="fa-solid fa-plus"></i></div>
            <div class="rv-back" title="Delete repo" onclick="deleteCurrentRepo()" style="background:rgba(255,69,58,0.1);border-color:rgba(255,69,58,0.2);color:var(--red);"><i class="fa-solid fa-trash-can"></i></div>
        </div>
        <input type="file" id="rv-file-upload" hidden multiple onchange="handleRvFileUpload(this)">
    </div>

    <!-- TABS: Files | Media | Info -->
    <div class="rv-tabs">
        <button class="rv-tab active" id="rvtab-files" onclick="switchRvTab('files',this)"><i class="fa-solid fa-file-code" style="margin-right:5px;"></i>Files</button>
        <button class="rv-tab" id="rvtab-media" onclick="switchRvTab('media',this)"><i class="fa-solid fa-photo-film" style="margin-right:5px;"></i>Media</button>
        <button class="rv-tab" id="rvtab-info" onclick="switchRvTab('info',this)"><i class="fa-solid fa-circle-info" style="margin-right:5px;"></i>Info</button>
    </div>

    <div class="rv-body" id="rvBody"></div>

    <!-- DEPLOY OVERLAY inside repo -->
    <div id="rv-deploy-overlay">
        <div class="rv-deploy-bar">
            <div class="rv-back" onclick="closeRvDeploy()"><i class="fa-solid fa-xmark"></i></div>
            <div class="rv-deploy-title" id="rvDeployTitle">Preview</div>
            <div style="display:flex;gap:6px;">
                <div class="rv-back" id="rvDeployMobileBtn" onclick="switchDeployTab('mobile')" title="Mobile view"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <div class="rv-back" id="rvDeployDesktopBtn" onclick="switchDeployTab('desktop')" style="background:rgba(0,122,255,0.12);border-color:rgba(0,122,255,0.3);color:var(--blue);" title="Desktop view"><i class="fa-solid fa-desktop"></i></div>
            </div>
        </div>
        <div class="rv-deploy-body">
            <iframe id="rv-deploy-frame-desktop" class="rv-deploy-frame"></iframe>
            <div class="rv-deploy-phone" id="rv-deploy-phone-wrap" style="display:none;">
                <div class="phone-frame" style="width:320px;height:620px;">
                    <div class="status-bar"><div id="rv-phone-time">00:00</div><div style="display:flex;gap:5px;"><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-signal"></i><i class="fa-solid fa-battery-full"></i></div></div>
                    <iframe id="rv-deploy-frame-mobile" style="width:100%;height:100%;border:none;padding-top:32px;"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MEDIA PREVIEW -->
<div id="media-preview">
    <div class="media-close" onclick="closeMediaPreview()"><i class="fa-solid fa-xmark"></i></div>
    <img id="preview-img" src="" style="display:none;">
    <video id="preview-vid" src="" controls style="display:none;"></video>
    <div class="media-filename" id="preview-name"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── LANG CONFIG ──────────────────────────────────────────────
const LANGS = [
    {id:'html', label:'HTML',       ext:'.html', color:'#ff6b35', icon:'fab fa-html5',    run:'preview'},
    {id:'css',  label:'CSS',        ext:'.css',  color:'#2965f1', icon:'fab fa-css3-alt', run:'preview'},
    {id:'js',   label:'JavaScript', ext:'.js',   color:'#f7df1e', icon:'fab fa-js',       run:'js'},
    {id:'py',   label:'Python',     ext:'.py',   color:'#3572a5', icon:'fab fa-python',   run:'sim'},
    {id:'json', label:'JSON',       ext:'.json', color:'#30d158', icon:'fas fa-code',     run:'json'},
    {id:'md',   label:'Markdown',   ext:'.md',   color:'#888',    icon:'fab fa-markdown', run:'md'},
    {id:'ts',   label:'TypeScript', ext:'.ts',   color:'#3178c6', icon:'fas fa-code',     run:'sim'},
    {id:'java', label:'Java',       ext:'.java', color:'#ed8b00', icon:'fab fa-java',     run:'sim'},
    {id:'cpp',  label:'C++',        ext:'.cpp',  color:'#659ad2', icon:'fas fa-code',     run:'sim'},
    {id:'sh',   label:'Shell',      ext:'.sh',   color:'#4eaa25', icon:'fas fa-terminal', run:'sim'},
    {id:'sql',  label:'SQL',        ext:'.sql',  color:'#e38c00', icon:'fas fa-database', run:'sim'},
    {id:'xml',  label:'XML',        ext:'.xml',  color:'#f60',    icon:'fas fa-code',     run:'preview'},
];

let currentLang = LANGS[0];
let repoMediaFiles = [];
let activeRepos = JSON.parse(localStorage.getItem('x0s_repos') || '[]');
let currentRepoId = null;
let currentRvTab = 'files';

// ─── EDITOR ───────────────────────────────────────────────────
const editor = document.getElementById('main-editor');
const actionBtn = document.getElementById('action-btn');

function initLangBar() {
    document.getElementById('langBar').innerHTML = LANGS.map(l =>
        `<div class="lang-chip${l.id===currentLang.id?' active':''}" onclick="setLang('${l.id}')">
            <i class="${l.icon}" style="margin-right:5px;color:${l.color};"></i>${l.label}
        </div>`
    ).join('');
}

function setLang(id) {
    currentLang = LANGS.find(l=>l.id===id) || LANGS[0];
    initLangBar();
    document.getElementById('langBadge').textContent = currentLang.label;
    document.getElementById('ext-badge').textContent = currentLang.ext;
}

function getLangFromFile(filename) {
    const ext = '.'+filename.split('.').pop().toLowerCase();
    return LANGS.find(l=>l.ext===ext) || LANGS[0];
}

function onEditorInput() {
    const lines = editor.value.split('\n').length;
    document.getElementById('lineCount').textContent = lines+' line'+(lines!==1?'s':'');
    actionBtn.innerText = editor.value.trim()==='' ? 'Paste' : 'Clear';
}

async function handleAction() {
    if (editor.value.trim()==='') {
        try { editor.value = await navigator.clipboard.readText(); } catch { editor.focus(); }
    } else { editor.value=''; }
    onEditorInput();
}

function handleFileUpload(input) {
    const file = input.files[0]; if(!file) return;
    setLang(getLangFromFile(file.name).id);
    const r = new FileReader();
    r.onload = e => { editor.value=e.target.result; onEditorInput(); };
    r.readAsText(file); input.value='';
}

// ─── RUN / DEPLOY ─────────────────────────────────────────────
function runCode() {
    const code = editor.value.trim(); if(!code) return;
    if(currentLang.run==='preview'||currentLang.run==='md') { deployToFrames(code); show('live',document.getElementById('tab-live')); return; }
    if(currentLang.run==='js') { runJS(code); return; }
    if(currentLang.run==='json') { runJSON(code); return; }
    simulateRun(code);
}

function deployToFrames(code) {
    let content = code;
    if(currentLang.id==='css') content=`<!DOCTYPE html><html><head><style>${code}</style></head><body><p style="color:#555;font-family:sans-serif;padding:20px;">CSS Preview</p></body></html>`;
    if(currentLang.id==='md') content=mdToHtml(code);
    ['live-frame','mobile-frame'].forEach(id => {
        const d=document.getElementById(id).contentDocument;
        d.open(); d.write(content); d.close();
    });
}

function deploy() { if(!editor.value.trim()) return; deployToFrames(editor.value); show('live',document.getElementById('tab-live')); }

function setOutput(html) {
    document.getElementById('outputPanel').innerHTML=html;
    show('output',null);
    document.querySelectorAll('.tab-trigger').forEach(t=>t.classList.remove('active'));
}

function runJS(code) {
    const logs=[];
    const fc={
        log:(...a)=>logs.push(a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')),
        error:(...a)=>logs.push('<span class="err">ERROR: '+a.join(' ')+'</span>'),
        warn:(...a)=>logs.push('<span style="color:var(--yellow)">WARN: '+a.join(' ')+'</span>'),
    };
    try { const fn=new Function('console',code); fn(fc); setOutput(logs.length?logs.join('\n'):'<span class="info">// No output</span>'); }
    catch(e) { setOutput('<span class="err">RuntimeError: '+e.message+'</span>'); }
}

function runJSON(code) {
    try { const p=JSON.parse(code); setOutput('<span style="color:#aaa;">✓ Valid JSON</span>\n\n'+JSON.stringify(p,null,2)); }
    catch(e) { setOutput('<span class="err">SyntaxError: '+e.message+'</span>'); }
}

function mdToHtml(md) {
    const html=md.replace(/^### (.+)/gm,'<h3>$1</h3>').replace(/^## (.+)/gm,'<h2>$1</h2>').replace(/^# (.+)/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code style="background:#f0f0f0;padding:2px 5px;border-radius:4px;">$1</code>').replace(/\n/g,'<br>');
    return `<!DOCTYPE html><html><head><style>body{font-family:sans-serif;padding:20px;line-height:1.7;max-width:700px;margin:auto;}</style></head><body>${html}</body></html>`;
}

function simulateRun(code) {
    const lines=code.split('\n').length;
    setOutput(`<span class="info">// ${currentLang.label} Compiler — x0s Sandbox\n// ${lines} lines compiled\n</span>\n<span style="color:#30d158;">✓ Syntax check passed\n✓ Build: ${currentLang.label} · ${new Date().toLocaleTimeString()}</span>`);
}

// ─── VIEWS ────────────────────────────────────────────────────
function show(mode, btn) {
    document.querySelectorAll('.tab-trigger').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    if(btn) btn.classList.add('active');
    const v=document.getElementById('view-'+mode);
    if(v) v.classList.add('active');
    if(mode==='history') loadHistory();
    if((mode==='live'||mode==='mobile')&&editor.value.trim()) deployToFrames(editor.value);
}

// ─── SAVE ─────────────────────────────────────────────────────
function openPortal() {
    document.getElementById('ext-badge').textContent=currentLang.ext;
    document.getElementById('portal').classList.add('show');
    setTimeout(()=>document.getElementById('file-name').focus(),100);
}
function closePortal() { document.getElementById('portal').classList.remove('show'); }

function saveFile() {
    const raw=document.getElementById('file-name').value.trim()||'x0s_build';
    const name=raw.replace(/\.[^.]+$/,'')+currentLang.ext;
    const content=editor.value;
    const history=JSON.parse(localStorage.getItem('x0s_history')||'[]');
    history.unshift({name,content,lang:currentLang.id,date:new Date().toLocaleString(),size:content.length});
    localStorage.setItem('x0s_history',JSON.stringify(history));
    const blob=new Blob([content],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    closePortal(); showToast('Saved '+name);
}

// ─── HISTORY ──────────────────────────────────────────────────
function lc(id) { return LANGS.find(l=>l.id===id)||LANGS[0]; }
function formatSize(b) { if(!b) return '—'; return b<1024?b+' B':(b/1024).toFixed(1)+' KB'; }

function loadHistory() {
    const list=document.getElementById('history-list');
    const history=JSON.parse(localStorage.getItem('x0s_history')||'[]');
    activeRepos=JSON.parse(localStorage.getItem('x0s_repos')||'[]');
    list.innerHTML='';

    // REPOS
    if(activeRepos.length) {
        addSectionLabel(list,'fa-code-branch','REPOSITORIES');
        activeRepos.forEach(repo=>{
            const div=document.createElement('div');
            div.className='history-item';
            div.innerHTML=`
                <div class="hist-icon" style="background:rgba(175,82,222,0.15);color:var(--purple);"><i class="fa-solid fa-code-branch"></i></div>
                <div class="hist-info" style="cursor:pointer;" onclick="openRepoViewer(${repo.id})">
                    <div class="hist-name">${repo.name}</div>
                    <div class="hist-meta">${repo.files.length} files · ${(repo.media||[]).length} media · ${repo.date}</div>
                </div>
                <div class="hist-three-dot" onclick="openRepoCtx(event,${repo.id})"><i class="fa-solid fa-ellipsis"></i></div>`;
            list.appendChild(div);
        });
        addDivider(list);
    }

    // BUILDS
    if(history.length) addSectionLabel(list,'fa-layer-group','BUILD HISTORY');
    history.forEach((item,index)=>{
        const l=lc(item.lang||'html');
        const div=document.createElement('div');
        div.className='history-item';
        div.innerHTML=`
            <div class="hist-icon" style="background:${l.color}22;color:${l.color};"><i class="${l.icon}"></i></div>
            <div class="hist-info" style="cursor:pointer;" onclick="restoreHistory(${index})">
                <div class="hist-name">${item.name}</div>
                <div class="hist-meta">${item.date} · ${formatSize(item.size||0)}</div>
            </div>
            <div class="hist-three-dot" onclick="openCtxMenu(event,${index})"><i class="fa-solid fa-ellipsis"></i></div>`;
        list.appendChild(div);
    });

    if(!history.length&&!activeRepos.length) {
        list.innerHTML='<p style="opacity:0.12;text-align:center;margin-top:40px;font-size:0.85rem;">Log Clear</p>';
    }
}

function addSectionLabel(parent,icon,text) {
    const d=document.createElement('div');
    d.style.cssText='font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:#333;padding:4px 4px 8px;';
    d.innerHTML=`<i class="fa-solid ${icon}" style="margin-right:6px;"></i>${text}`;
    parent.appendChild(d);
}
function addDivider(parent) {
    const d=document.createElement('div');
    d.style.cssText='height:1px;background:var(--border);margin:8px 4px;';
    parent.appendChild(d);
}

function restoreHistory(index) {
    const history=JSON.parse(localStorage.getItem('x0s_history'));
    const item=history[index];
    editor.value=item.content; setLang(item.lang||'html'); onEditorInput();
    show('code',document.getElementById('tab-code'));
}

function downloadFromHistory(index) {
    const h=JSON.parse(localStorage.getItem('x0s_history'));
    const item=h[index];
    const blob=new Blob([item.content],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=item.name; a.click();
}

function deleteHistory(index) {
    const h=JSON.parse(localStorage.getItem('x0s_history'));
    h.splice(index,1);
    localStorage.setItem('x0s_history',JSON.stringify(h));
    loadHistory(); showToast('Build removed');
}

// ─── HISTORY CTX MENU ─────────────────────────────────────────
function openCtxMenu(e,index) {
    e.stopPropagation();
    const menu=document.getElementById('ctxMenu');
    menu.innerHTML=`
        <div class="ctx-item" onclick="restoreHistory(${index});closeCtx();"><i class="fa-solid fa-rotate-left" style="color:var(--blue);"></i>Restore to Editor</div>
        <div class="ctx-item" onclick="downloadFromHistory(${index});closeCtx();"><i class="fa-solid fa-download" style="color:var(--green);"></i>Download</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" onclick="openRepoModal(${index});closeCtx();"><i class="fa-solid fa-code-branch" style="color:var(--yellow);"></i>Add to Quick Repo</div>
        <div class="ctx-item" onclick="openNewRepoFrom(${index});closeCtx();"><i class="fa-solid fa-folder-plus" style="color:var(--purple);"></i>New Repo with file</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item danger" onclick="deleteHistory(${index});closeCtx();"><i class="fa-solid fa-trash-can"></i>Delete Build</div>`;
    positionCtx(menu,e);
    setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),50);
}

function openRepoCtx(e,repoId) {
    e.stopPropagation();
    const menu=document.getElementById('ctxMenu');
    menu.innerHTML=`
        <div class="ctx-item" onclick="openRepoViewer(${repoId});closeCtx();"><i class="fa-solid fa-folder-open" style="color:var(--blue);"></i>Open Repo</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item danger" onclick="deleteRepo(${repoId});closeCtx();"><i class="fa-solid fa-trash-can"></i>Delete Repo</div>`;
    positionCtx(menu,e);
    setTimeout(()=>document.addEventListener('click',closeCtx,{once:true}),50);
}

function positionCtx(menu,e) {
    const rect=e.target.getBoundingClientRect();
    menu.style.display='block';
    menu.style.right='16px'; menu.style.left='auto';
    menu.style.top=Math.min(rect.bottom+4,window.innerHeight-220)+'px';
}
function closeCtx() { document.getElementById('ctxMenu').style.display='none'; }

// ─── REPO CREATE MODAL ────────────────────────────────────────
function openRepoModal(preIndex=null) {
    repoMediaFiles=[];
    document.getElementById('repoMediaThumbs').innerHTML='';
    document.getElementById('repoName').value='';
    document.getElementById('repoDesc').value='';
    const history=JSON.parse(localStorage.getItem('x0s_history')||'[]');
    const sel=document.getElementById('fileSelector');
    sel.innerHTML=history.length?'':'<p style="color:#333;font-size:0.78rem;text-align:center;padding:10px;">No saved builds yet</p>';
    history.forEach((item,i)=>{
        const l=lc(item.lang||'html');
        const pre=preIndex===i;
        const div=document.createElement('div');
        div.className='file-check-item'+(pre?' selected':'');
        div.dataset.index=i;
        div.onclick=()=>toggleFileSelect(div);
        div.innerHTML=`<div class="file-check-icon" style="background:${l.color}22;color:${l.color};"><i class="${l.icon}"></i></div>
            <div class="file-check-name">${item.name}</div>
            <div class="file-check-cb">${pre?'<i class="fa-solid fa-check" style="font-size:10px;color:#fff;"></i>':''}</div>`;
        sel.appendChild(div);
    });
    document.getElementById('repo-modal').classList.add('show');
}

function openNewRepoFrom(index) { openRepoModal(index); }
function closeRepoModal() { document.getElementById('repo-modal').classList.remove('show'); }

function toggleFileSelect(div) {
    div.classList.toggle('selected');
    div.querySelector('.file-check-cb').innerHTML=div.classList.contains('selected')?'<i class="fa-solid fa-check" style="font-size:10px;color:#fff;"></i>':'';
}

function handleRepoMedia(input) {
    Array.from(input.files).forEach(file=>{
        const r=new FileReader();
        r.onload=e=>{
            repoMediaFiles.push({name:file.name,type:file.type.startsWith('video')?'video':'image',dataUrl:e.target.result});
            renderModalMediaThumbs();
        };
        r.readAsDataURL(file);
    });
    input.value='';
}

function renderModalMediaThumbs() {
    const c=document.getElementById('repoMediaThumbs');
    c.innerHTML='';
    repoMediaFiles.forEach((f,i)=>{
        if(f.type==='image') {
            const img=document.createElement('img');
            img.className='media-thumb'; img.src=f.dataUrl;
            img.onclick=()=>showMediaPreview(f);
            c.appendChild(img);
        } else {
            const d=document.createElement('div');
            d.className='media-thumb-video';
            d.innerHTML='<i class="fa-solid fa-play"></i>';
            d.onclick=()=>showMediaPreview(f);
            c.appendChild(d);
        }
    });
}

function createRepo() {
    const name=document.getElementById('repoName').value.trim();
    if(!name) { showToast('Enter a repo name'); return; }
    const idxs=[];
    document.querySelectorAll('.file-check-item.selected').forEach(el=>idxs.push(parseInt(el.dataset.index)));
    if(!idxs.length&&!repoMediaFiles.length) { showToast('Select at least one file or media'); return; }
    const history=JSON.parse(localStorage.getItem('x0s_history')||'[]');
    const repo={
        id:Date.now(), name,
        desc:document.getElementById('repoDesc').value.trim(),
        date:new Date().toLocaleString(),
        files:idxs.map(i=>({...history[i]})),
        media:[...repoMediaFiles],
    };
    activeRepos.unshift(repo);
    localStorage.setItem('x0s_repos',JSON.stringify(activeRepos));
    closeRepoModal();
    showToast('Repo "'+name+'" created!');
    show('history',document.getElementById('tab-history'));
}

// ─── REPO VIEWER ──────────────────────────────────────────────
function openRepoViewer(repoId) {
    currentRepoId=repoId;
    currentRvTab='files';
    const repo=getRepo(repoId); if(!repo) return;
    document.getElementById('rvName').textContent=repo.name;
    document.getElementById('rv-deploy-overlay').classList.remove('show');
    document.querySelectorAll('.rv-tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('rvtab-files').classList.add('active');
    renderRvTab('files');
    document.getElementById('repo-viewer').classList.add('show');
}

function closeRepoViewer() {
    document.getElementById('repo-viewer').classList.remove('show');
    currentRepoId=null;
    loadHistory();
}

function getRepo(id) { return activeRepos.find(r=>r.id===id); }

function saveRepos() { localStorage.setItem('x0s_repos',JSON.stringify(activeRepos)); }

function switchRvTab(tab,btn) {
    currentRvTab=tab;
    document.querySelectorAll('.rv-tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    renderRvTab(tab);
}

function renderRvTab(tab) {
    const body=document.getElementById('rvBody');
    body.innerHTML='';
    const repo=getRepo(currentRepoId); if(!repo) return;
    if(tab==='files') renderFilesTab(body,repo);
    if(tab==='media') renderMediaTab(body,repo);
    if(tab==='info') renderInfoTab(body,repo);
}

// FILES TAB
function renderFilesTab(body,repo) {
    // Upload prompt at top
    const zone=document.createElement('div');
    zone.className='rv-upload-zone';
    zone.innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i>Upload file to repo';
    zone.onclick=()=>document.getElementById('rv-file-upload').click();
    body.appendChild(zone);

    if(!repo.files.length) {
        const empty=document.createElement('div');
        empty.style.cssText='text-align:center;color:#333;padding:20px;font-size:0.8rem;';
        empty.textContent='No files yet — upload above';
        body.appendChild(empty); return;
    }

    const wrap=document.createElement('div');
    wrap.className='rv-files-wrap'; wrap.style.paddingTop='0';
    repo.files.forEach((file,fi)=>{
        const l=lc(file.lang||'html');
        const row=document.createElement('div');
        row.className='rv-file-row';
        row.innerHTML=`
            <div class="rv-file-icon" style="background:${l.color}22;color:${l.color};"><i class="${l.icon}"></i></div>
            <div class="rv-file-info">
                <div class="rv-file-name" id="rv-fname-${fi}">${file.name}</div>
                <div class="rv-file-meta">${formatSize(file.size||0)} · ${file.date}</div>
            </div>
            <div class="rv-file-actions">
                <div class="rv-action-btn" title="Rename" onclick="startRename(${fi})"><i class="fa-solid fa-pencil"></i></div>
                <div class="rv-action-btn deploy" title="Quick Deploy" onclick="quickDeploy(${fi})"><i class="fa-solid fa-rocket"></i></div>
                <div class="rv-action-btn" title="Load to editor" onclick="loadFileToEditor(${fi})"><i class="fa-solid fa-code"></i></div>
                <div class="rv-action-btn" title="Download" onclick="downloadRepoFile(${fi})"><i class="fa-solid fa-download"></i></div>
                <div class="rv-action-btn danger" title="Delete" onclick="deleteRepoFile(${fi})"><i class="fa-solid fa-trash-can"></i></div>
            </div>`;
        wrap.appendChild(row);
    });
    body.appendChild(wrap);
}

function startRename(fi) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    const nameEl=document.getElementById('rv-fname-'+fi);
    const oldName=repo.files[fi].name;
    const input=document.createElement('input');
    input.type='text'; input.className='rv-rename-input';
    input.value=oldName;
    nameEl.innerHTML=''; nameEl.appendChild(input); input.focus(); input.select();
    const commit=()=>{
        const newName=input.value.trim()||oldName;
        repo.files[fi].name=newName;
        saveRepos(); renderRvTab('files'); showToast('Renamed to '+newName);
    };
    input.onblur=commit;
    input.onkeydown=e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape'){nameEl.textContent=oldName;} };
}

function quickDeploy(fi) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    const file=repo.files[fi];
    const overlay=document.getElementById('rv-deploy-overlay');
    document.getElementById('rvDeployTitle').textContent=file.name;
    let content=file.content;
    const l=lc(file.lang||'html');
    if(l.id==='css') content=`<!DOCTYPE html><html><head><style>${content}</style></head><body><p style="color:#555;font-family:sans-serif;padding:20px;">CSS Preview</p></body></html>`;
    if(l.id==='md') content=mdToHtml(content);
    // Write to both frames
    ['rv-deploy-frame-desktop','rv-deploy-frame-mobile'].forEach(id=>{
        const d=document.getElementById(id).contentDocument;
        d.open(); d.write(content); d.close();
    });
    switchDeployTab('desktop');
    overlay.classList.add('show');
}

function switchDeployTab(mode) {
    const desktop=document.getElementById('rv-deploy-frame-desktop');
    const phoneWrap=document.getElementById('rv-deploy-phone-wrap');
    const dBtn=document.getElementById('rvDeployDesktopBtn');
    const mBtn=document.getElementById('rvDeployMobileBtn');
    if(mode==='desktop') {
        desktop.style.display='block'; phoneWrap.style.display='none';
        dBtn.style.cssText='background:rgba(0,122,255,0.12);border-color:rgba(0,122,255,0.3);color:var(--blue);width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
        mBtn.style.cssText='background:var(--card);border:1px solid var(--border);color:#aaa;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
    } else {
        desktop.style.display='none'; phoneWrap.style.display='flex';
        mBtn.style.cssText='background:rgba(0,122,255,0.12);border-color:rgba(0,122,255,0.3);color:var(--blue);width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
        dBtn.style.cssText='background:var(--card);border:1px solid var(--border);color:#aaa;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
    }
}

function closeRvDeploy() { document.getElementById('rv-deploy-overlay').classList.remove('show'); }

function loadFileToEditor(fi) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    const file=repo.files[fi];
    editor.value=file.content; setLang(file.lang||'html'); onEditorInput();
    closeRepoViewer();
    show('code',document.getElementById('tab-code'));
    showToast('Loaded '+file.name);
}

function downloadRepoFile(fi) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    const file=repo.files[fi];
    const blob=new Blob([file.content],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
}

function deleteRepoFile(fi) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    const name=repo.files[fi].name;
    repo.files.splice(fi,1);
    saveRepos(); renderRvTab('files'); showToast('Deleted '+name);
}

// Upload new file into repo
function handleRvFileUpload(input) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    Array.from(input.files).forEach(file=>{
        const l=getLangFromFile(file.name);
        const r=new FileReader();
        r.onload=e=>{
            repo.files.push({name:file.name,content:e.target.result,lang:l.id,date:new Date().toLocaleString(),size:e.target.result.length});
            saveRepos(); renderRvTab('files'); showToast('Added '+file.name);
        };
        r.readAsText(file);
    });
    input.value='';
}

// MEDIA TAB
function renderMediaTab(body,repo) {
    // Upload zone
    const zone=document.createElement('div');
    zone.className='rv-upload-zone'; zone.style.margin='12px 16px';
    zone.innerHTML='<i class="fa-solid fa-photo-film"></i>Upload photos or videos';
    zone.onclick=()=>{
        const inp=document.createElement('input');
        inp.type='file'; inp.accept='image/*,video/*'; inp.multiple=true;
        inp.onchange=e=>handleRvMediaUpload(e.target.files);
        inp.click();
    };
    body.appendChild(zone);

    const media=repo.media||[];
    if(!media.length) {
        const empty=document.createElement('div');
        empty.style.cssText='text-align:center;color:#333;padding:10px 20px;font-size:0.8rem;';
        empty.textContent='No media yet';
        body.appendChild(empty); return;
    }

    const wrap=document.createElement('div');
    wrap.className='rv-media-wrap';
    const grid=document.createElement('div');
    grid.className='rv-media-grid';
    media.forEach((m,mi)=>{
        const cell=document.createElement('div');
        cell.className='rv-media-cell';
        if(m.type==='image') {
            cell.innerHTML=`<img src="${m.dataUrl}" loading="lazy"><div class="rv-media-del" onclick="deleteRepoMedia(${mi},event)"><i class="fa-solid fa-xmark"></i></div>`;
            cell.querySelector('img').onclick=()=>showMediaPreview(m);
        } else {
            cell.innerHTML=`<div class="play-icon"><i class="fa-solid fa-play"></i></div><div class="rv-media-del" onclick="deleteRepoMedia(${mi},event)"><i class="fa-solid fa-xmark"></i></div>`;
            cell.querySelector('.play-icon').onclick=()=>showMediaPreview(m);
        }
        grid.appendChild(cell);
    });
    wrap.appendChild(grid);
    body.appendChild(wrap);
}

function handleRvMediaUpload(files) {
    const repo=getRepo(currentRepoId); if(!repo) return;
    if(!repo.media) repo.media=[];
    Array.from(files).forEach(file=>{
        const r=new FileReader();
        r.onload=e=>{
            repo.media.push({name:file.name,type:file.type.startsWith('video')?'video':'image',dataUrl:e.target.result});
            saveRepos(); renderRvTab('media'); showToast('Added '+file.name);
        };
        r.readAsDataURL(file);
    });
}

function deleteRepoMedia(mi,e) {
    e.stopPropagation();
    const repo=getRepo(currentRepoId); if(!repo) return;
    const name=repo.media[mi].name;
    repo.media.splice(mi,1);
    saveRepos(); renderRvTab('media'); showToast('Removed '+name);
}

// INFO TAB
function renderInfoTab(body,repo) {
    body.innerHTML='';
    const wrap=document.createElement('div');
    wrap.style.cssText='padding:16px;display:flex;flex-direction:column;gap:10px;';

    const statsRow=document.createElement('div');
    statsRow.className='rv-stats'; statsRow.style.padding='0';
    statsRow.innerHTML=`
        <div class="rv-stat"><i class="fa-solid fa-file-code"></i>${repo.files.length} file${repo.files.length!==1?'s':''}</div>
        <div class="rv-stat"><i class="fa-solid fa-photo-film"></i>${(repo.media||[]).length} media</div>
        <div class="rv-stat"><i class="fa-solid fa-clock"></i>${repo.date}</div>`;
    wrap.appendChild(statsRow);

    // Editable name
    const nameLabel=document.createElement('div');
    nameLabel.innerHTML='<div style="font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:#444;margin-bottom:6px;">REPO NAME</div>';
    const nameInput=document.createElement('input');
    nameInput.type='text'; nameInput.style.cssText='width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:14px;border-radius:16px;color:white;outline:none;font-size:0.9rem;font-family:Space Grotesk,sans-serif;margin-bottom:0;text-align:left;';
    nameInput.value=repo.name;
    nameInput.onchange=()=>{ repo.name=nameInput.value.trim()||repo.name; saveRepos(); document.getElementById('rvName').textContent=repo.name; showToast('Name updated'); };
    nameLabel.appendChild(nameInput);
    wrap.appendChild(nameLabel);

    // Editable desc
    const descLabel=document.createElement('div');
    descLabel.innerHTML='<div style="font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:#444;margin-bottom:6px;">DESCRIPTION</div>';
    const descInput=document.createElement('input');
    descInput.type='text'; descInput.style.cssText='width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:14px;border-radius:16px;color:white;outline:none;font-size:0.85rem;font-family:Space Grotesk,sans-serif;margin-bottom:0;text-align:left;';
    descInput.value=repo.desc||'';
    descInput.placeholder='Add a description...';
    descInput.onchange=()=>{ repo.desc=descInput.value.trim(); saveRepos(); showToast('Description updated'); };
    descLabel.appendChild(descInput);
    wrap.appendChild(descLabel);

    // Danger zone
    const danger=document.createElement('div');
    danger.style.cssText='margin-top:12px;padding:16px;background:rgba(255,69,58,0.06);border:1px solid rgba(255,69,58,0.2);border-radius:20px;';
    danger.innerHTML='<div style="font-size:0.7rem;color:var(--red);font-weight:700;margin-bottom:10px;">DANGER ZONE</div>';
    const delBtn=document.createElement('button');
    delBtn.className='btn'; delBtn.style.cssText='background:rgba(255,69,58,0.15);color:var(--red);width:100%;border:1px solid rgba(255,69,58,0.3);border-radius:14px;padding:12px;';
    delBtn.innerHTML='<i class="fa-solid fa-trash-can" style="margin-right:8px;"></i>Delete Repo';
    delBtn.onclick=deleteCurrentRepo;
    danger.appendChild(delBtn);
    wrap.appendChild(danger);

    body.appendChild(wrap);
}

function deleteCurrentRepo() {
    if(!currentRepoId) return;
    activeRepos=activeRepos.filter(r=>r.id!==currentRepoId);
    saveRepos(); closeRepoViewer(); showToast('Repo deleted');
}

function deleteRepo(id) {
    activeRepos=activeRepos.filter(r=>r.id!==id);
    saveRepos(); loadHistory(); showToast('Repo deleted');
}

// ─── MEDIA PREVIEW ────────────────────────────────────────────
function showMediaPreview(m) {
    const img=document.getElementById('preview-img');
    const vid=document.getElementById('preview-vid');
    img.style.display='none'; vid.style.display='none';
    if(m.type==='image') { img.src=m.dataUrl; img.style.display='block'; }
    else { vid.src=m.dataUrl; vid.style.display='block'; }
    document.getElementById('preview-name').textContent=m.name;
    document.getElementById('media-preview').classList.add('show');
}
function closeMediaPreview() { document.getElementById('media-preview').classList.remove('show'); }

// ─── TOAST ────────────────────────────────────────────────────
let toastTimer=null;
function showToast(msg) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ─── CLOCK ────────────────────────────────────────────────────
function setTime() {
    const t=new Date();
    const s=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    ['phone-time','rv-phone-time'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=s; });
}
setInterval(setTime,1000); setTime();

// ─── INIT ────────────────────────────────────────────────────
initLangBar(); onEditorInput();
</script>
</body>
</html>
