<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x0s | Compiler</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000; --accent: #ffffff; --card: #0a0a0a; --border: #1a1a1a;
            --code-cyan: #00d2ff; --glass: rgba(255,255,255,0.03); --blue: #007aff;
            --red: #ff453a; --green: #30d158; --yellow: #ffd60a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--accent); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 18px 20px 8px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .brand { font-weight: 700; letter-spacing: -1px; font-size: 1.1rem; }
        .version { font-size: 8px; opacity: 0.3; letter-spacing: 2px; }

        /* LANG SELECTOR BAR */
        .lang-bar { display: flex; gap: 6px; padding: 6px 16px 4px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .lang-bar::-webkit-scrollbar { display: none; }
        .lang-chip { background: var(--card); border: 1px solid var(--border); color: #555; padding: 6px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: 0.25s; white-space: nowrap; flex-shrink: 0; }
        .lang-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

        /* TAB NAV */
        .tab-nav { display: flex; gap: 6px; padding: 6px 16px 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .tab-nav::-webkit-scrollbar { display: none; }
        .tab-trigger { background: var(--card); border: 1px solid var(--border); color: #555; padding: 9px 18px; border-radius: 50px; font-size: 0.73rem; font-weight: 600; cursor: pointer; transition: 0.25s; white-space: nowrap; flex-shrink: 0; }
        .tab-trigger.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

        /* STAGE */
        .stage { flex: 1; position: relative; min-height: 0; margin-bottom: 110px; }
        .view { position: absolute; inset: 0 12px; opacity: 0; transform: scale(0.98); pointer-events: none; transition: 0.35s cubic-bezier(0.2,0.8,0.2,1); display: flex; }
        .view.active { opacity: 1; transform: scale(1); pointer-events: all; }

        /* EDITOR */
        .editor-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 26px; width: 100%; overflow: hidden; display: flex; flex-direction: column; }
        .editor-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 8px; border-bottom: 1px solid var(--border); }
        .editor-lang-badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; opacity: 0.5; }
        .line-count { font-size: 0.65rem; opacity: 0.3; font-family: 'Fira Code', monospace; }
        textarea { width: 100%; flex: 1; background: transparent; border: none; color: var(--code-cyan); padding: 16px 20px; font-family: 'Fira Code', monospace; font-size: 12.5px; line-height: 1.7; outline: none; resize: none; overflow: auto; tab-size: 2; }

        /* LIVE */
        #view-live iframe, #view-mobile iframe { width: 100%; height: 100%; border: none; background: white; }
        #view-live { border-radius: 26px; overflow: hidden; border: 1px solid var(--border); }
        
        /* OUTPUT PANEL (for non-HTML) */
        .output-panel { width: 100%; height: 100%; background: var(--card); border-radius: 26px; border: 1px solid var(--border); overflow: auto; padding: 20px; font-family: 'Fira Code', monospace; font-size: 12.5px; line-height: 1.7; color: var(--green); white-space: pre-wrap; }
        .output-panel .err { color: var(--red); }
        .output-panel .info { color: #aaa; }

        /* MOBILE */
        .phone-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; }
        .phone-frame { width: 345px; height: 700px; background: #000; border: 10px solid #141414; border-radius: 52px; position: relative; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.9); flex-shrink: 0; }
        .status-bar { position: absolute; top: 0; left: 0; width: 100%; height: 32px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 11px; z-index: 11; color: white; background: black; }
        .phone-frame iframe { width: 100%; height: 100%; border: none; background: white; padding-top: 32px; }

        /* HISTORY */
        .history-view { width: 100%; height: 100%; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
        .history-view::-webkit-scrollbar { display: none; }
        .history-item { background: var(--card); border: 1px solid var(--border); padding: 14px 16px; border-radius: 22px; display: flex; align-items: center; gap: 12px; position: relative; }
        .hist-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
        .hist-info { flex: 1; min-width: 0; }
        .hist-name { font-weight: 600; font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hist-meta { font-size: 0.68rem; color: #555; margin-top: 2px; }
        .hist-three-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 0.9rem; flex-shrink: 0; }
        .hist-three-dot:hover { background: rgba(255,255,255,0.06); color: #fff; }

        /* CONTEXT MENU */
        .ctx-menu { position: fixed; background: #111; border: 1px solid #222; border-radius: 18px; padding: 6px; z-index: 3000; min-width: 190px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); animation: ctxIn 0.2s cubic-bezier(0.2,0.8,0.2,1); }
        @keyframes ctxIn { from { opacity:0; transform:scale(0.92) translateY(6px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .ctx-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .ctx-item:hover { background: rgba(255,255,255,0.07); }
        .ctx-item i { width: 16px; text-align: center; }
        .ctx-item.danger { color: var(--red); }
        .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

        /* REPO MODAL */
        #repo-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(20px); display: none; align-items: flex-end; justify-content: center; z-index: 4000; }
        #repo-modal.show { display: flex; }
        .repo-sheet { background: #0d0d0d; border: 1px solid var(--border); border-radius: 36px 36px 0 0; width: 100%; max-width: 520px; padding: 28px 20px 40px; animation: sheetUp 0.4s cubic-bezier(0.32,0.72,0,1); max-height: 85vh; overflow-y: auto; }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .repo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .repo-title { font-size: 1rem; font-weight: 700; }
        .repo-close { width: 32px; height: 32px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #aaa; }
        .repo-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 16px 18px; border-radius: 18px; color: white; outline: none; font-size: 0.85rem; font-family: 'Space Grotesk', sans-serif; margin-bottom: 14px; }
        .repo-input::placeholder { color: #333; }
        .file-selector { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; max-height: 220px; overflow-y: auto; }
        .file-check-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .file-check-item.selected { border-color: var(--blue); background: rgba(0,122,255,0.08); }
        .file-check-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
        .file-check-name { flex: 1; font-size: 0.8rem; font-weight: 600; }
        .file-check-cb { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #333; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .file-check-item.selected .file-check-cb { background: var(--blue); border-color: var(--blue); }
        .section-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px; color: #444; margin-bottom: 10px; }
        
        /* REPO VIEWER */
        #repo-viewer { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
        #repo-viewer.show { display: flex; }
        .repo-topbar { padding: 16px 20px 10px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .repo-back { width: 36px; height: 36px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .repo-view-name { font-weight: 700; font-size: 1rem; flex: 1; }
        .repo-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 16px; gap: 8px; }
        .repo-file-entry { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .repo-file-entry:hover { border-color: #333; }
        .repo-file-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
        .repo-file-info { flex: 1; }
        .repo-file-name { font-size: 0.83rem; font-weight: 600; }
        .repo-file-size { font-size: 0.67rem; color: #555; margin-top: 2px; }
        .repo-stats { display: flex; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
        .repo-stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 50px; padding: 6px 14px; font-size: 0.7rem; display: flex; align-items: center; gap: 6px; color: #666; }
        .repo-stat-chip i { font-size: 0.65rem; }

        /* MEDIA PREVIEW */
        #media-preview { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 6000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        #media-preview.show { display: flex; }
        #media-preview img, #media-preview video { max-width: 90vw; max-height: 80vh; border-radius: 18px; object-fit: contain; }
        .media-close { position: absolute; top: 20px; right: 20px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .media-filename { margin-top: 14px; font-size: 0.8rem; color: #555; }

        /* UPLOAD ZONE IN REPO */
        .upload-zone { border: 1.5px dashed #222; border-radius: 18px; padding: 20px; text-align: center; color: #333; font-size: 0.78rem; cursor: pointer; transition: 0.2s; margin-bottom: 14px; }
        .upload-zone:hover { border-color: #444; color: #666; }
        .upload-zone i { display: block; font-size: 1.4rem; margin-bottom: 6px; }
        .media-thumb-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .media-thumb { width: 68px; height: 68px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
        .media-thumb-video { width: 68px; height: 68px; border-radius: 14px; background: #111; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: #555; cursor: pointer; font-size: 1.2rem; position: relative; }

        /* DOCK */
        .dock-container { position: fixed; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; z-index: 100; }
        .circle-btn { width: 50px; height: 50px; background: var(--card); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 0.85rem; flex-shrink: 0; }
        .dock { background: rgba(12,12,12,0.85); backdrop-filter: blur(22px); border: 1px solid var(--border); padding: 6px; border-radius: 60px; display: flex; gap: 4px; }
        .btn { background: transparent; border: none; color: white; padding: 11px 20px; border-radius: 50px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Space Grotesk', sans-serif; }
        .btn:hover { background: rgba(255,255,255,0.06); }
        .btn-primary { background: var(--accent); color: var(--bg); }
        .btn-primary:hover { background: #ddd; }
        .btn-run { background: var(--blue); color: white; }

        /* SAVE PORTAL */
        #portal { position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(16px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        #portal.show { display: flex; }
        .portal-box { background: #0d0d0d; border: 1px solid var(--border); padding: 36px 28px; border-radius: 36px; width: 90%; max-width: 320px; text-align: center; }
        .portal-box h2 { margin-bottom: 8px; font-size: 1.1rem; }
        .portal-box p { font-size: 0.75rem; color: #444; margin-bottom: 20px; }
        input[type="text"] { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 16px; border-radius: 18px; color: white; margin-bottom: 16px; text-align: center; outline: none; font-size: 0.85rem; font-family: 'Space Grotesk', sans-serif; }
        .ext-badge { display: inline-block; background: rgba(0,122,255,0.15); color: var(--blue); border-radius: 8px; padding: 3px 10px; font-size: 0.68rem; font-weight: 700; margin-bottom: 16px; }

        /* TOAST */
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #111; border: 1px solid #222; color: white; padding: 10px 22px; border-radius: 50px; font-size: 0.78rem; font-weight: 600; z-index: 9999; transition: 0.35s cubic-bezier(0.32,0.72,0,1); white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="brand">x0s <span style="font-weight:300;opacity:0.4;">Compiler</span></div>
    <div class="version">V5.0_CORE</div>
</header>

<!-- LANGUAGE SELECTOR -->
<div class="lang-bar" id="langBar"></div>

<!-- TAB NAV -->
<div class="tab-nav">
    <button id="tab-code" class="tab-trigger active" onclick="show('code',this)">Architecture</button>
    <button id="tab-live" class="tab-trigger" onclick="show('live',this)">Live View</button>
    <button id="tab-mobile" class="tab-trigger" onclick="show('mobile',this)">Mobile View</button>
    <button id="tab-history" class="tab-trigger" onclick="show('history',this)">Build History</button>
</div>

<main class="stage">
    <!-- EDITOR -->
    <div id="view-code" class="view active">
        <div class="editor-wrap">
            <div class="editor-toolbar">
                <span class="editor-lang-badge" id="langBadge">HTML</span>
                <span class="line-count" id="lineCount">0 lines</span>
            </div>
            <textarea id="main-editor" spellcheck="false" placeholder="// Start building..." oninput="onEditorInput()"></textarea>
        </div>
    </div>

    <!-- LIVE -->
    <div id="view-live" class="view">
        <iframe id="live-frame"></iframe>
    </div>

    <!-- MOBILE -->
    <div id="view-mobile" class="view">
        <div class="phone-container">
            <div class="phone-frame">
                <div class="status-bar">
                    <div id="phone-time">00:00</div>
                    <div style="display:flex;gap:5px;"><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-signal"></i><i class="fa-solid fa-battery-full"></i></div>
                </div>
                <iframe id="mobile-frame"></iframe>
            </div>
        </div>
    </div>

    <!-- OUTPUT (non-HTML) -->
    <div id="view-output" class="view">
        <div class="output-panel" id="outputPanel"><span class="info">// Run your code to see output here</span></div>
    </div>

    <!-- HISTORY -->
    <div id="view-history" class="view">
        <div id="history-list" class="history-view"></div>
    </div>
</main>

<!-- DOCK -->
<div class="dock-container">
    <div class="circle-btn" onclick="document.getElementById('file-upload').click()" title="Upload file"><i class="fa-solid fa-cloud-arrow-up"></i></div>
    <input type="file" id="file-upload" hidden onchange="handleFileUpload(this)">
    <div class="dock">
        <button id="action-btn" class="btn" onclick="handleAction()">Paste</button>
        <button class="btn" onclick="openPortal()">Save</button>
        <button id="run-btn" class="btn btn-run" onclick="runCode()">▶ Run</button>
        <button class="btn btn-primary" onclick="deploy()">Deploy</button>
    </div>
</div>

<!-- SAVE PORTAL -->
<div id="portal">
    <div class="portal-box">
        <h2>Commit Build</h2>
        <p>Name this file — extension auto-applied</p>
        <input type="text" id="file-name" placeholder="x0s_core_index" autocomplete="off">
        <div class="ext-badge" id="ext-badge">.html</div><br>
        <div style="display:flex;gap:10px;margin-top:8px;">
            <button class="btn" style="flex:1;border:1px solid var(--border);" onclick="closePortal()">Abort</button>
            <button class="btn btn-primary" style="flex:2;" onclick="saveFile()">Confirm</button>
        </div>
    </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu" style="display:none;"></div>

<!-- QUICK REPO MODAL -->
<div id="repo-modal">
    <div class="repo-sheet">
        <div class="repo-header">
            <div class="repo-title"><i class="fa-solid fa-code-branch" style="color:var(--blue);margin-right:8px;"></i>Quick Repo</div>
            <div class="repo-close" onclick="closeRepoModal()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="section-label">REPO NAME</div>
        <input type="text" class="repo-input" id="repoName" placeholder="my-project-v1">
        <div class="section-label">DESCRIPTION</div>
        <input type="text" class="repo-input" id="repoDesc" placeholder="What does this repo contain?">
        <div class="section-label">SELECT FILES</div>
        <div class="file-selector" id="fileSelector"></div>
        <div class="section-label">MEDIA UPLOAD</div>
        <div class="upload-zone" onclick="document.getElementById('repo-media-upload').click()">
            <i class="fa-solid fa-photo-film"></i>
            Tap to add photos or videos
        </div>
        <input type="file" id="repo-media-upload" hidden accept="image/*,video/*" multiple onchange="handleRepoMedia(this)">
        <div class="media-thumb-list" id="repoMediaThumbs"></div>
        <button class="btn btn-primary" style="width:100%;padding:14px;border-radius:18px;font-size:0.9rem;" onclick="createRepo()">
            <i class="fa-solid fa-plus" style="margin-right:6px;"></i>Create Repo
        </button>
    </div>
</div>

<!-- REPO VIEWER -->
<div id="repo-viewer">
    <div class="repo-topbar">
        <div class="repo-back" onclick="closeRepoViewer()"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="repo-view-name" id="repoViewName">—</div>
        <div style="font-size:0.7rem;color:#444;" id="repoViewDate"></div>
    </div>
    <div class="repo-stats" id="repoViewStats"></div>
    <div class="repo-body" id="repoViewBody"></div>
</div>

<!-- MEDIA PREVIEW -->
<div id="media-preview">
    <div class="media-close" onclick="closeMediaPreview()"><i class="fa-solid fa-xmark"></i></div>
    <img id="preview-img" src="" style="display:none;">
    <video id="preview-vid" src="" controls style="display:none;"></video>
    <div class="media-filename" id="preview-name"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  LANGUAGE CONFIG
// ============================================================
const LANGS = [
    { id:'html',  label:'HTML',       ext:'.html',  color:'#ff6b35', icon:'fab fa-html5',   run:'preview' },
    { id:'css',   label:'CSS',        ext:'.css',   color:'#2965f1', icon:'fab fa-css3-alt', run:'preview' },
    { id:'js',    label:'JavaScript', ext:'.js',    color:'#f7df1e', icon:'fab fa-js',       run:'js'      },
    { id:'py',    label:'Python',     ext:'.py',    color:'#3572a5', icon:'fab fa-python',   run:'sim'     },
    { id:'json',  label:'JSON',       ext:'.json',  color:'#30d158', icon:'fas fa-code',     run:'json'    },
    { id:'md',    label:'Markdown',   ext:'.md',    color:'#888',    icon:'fab fa-markdown', run:'md'      },
    { id:'ts',    label:'TypeScript', ext:'.ts',    color:'#3178c6', icon:'fas fa-code',     run:'sim'     },
    { id:'java',  label:'Java',       ext:'.java',  color:'#ed8b00', icon:'fab fa-java',     run:'sim'     },
    { id:'cpp',   label:'C++',        ext:'.cpp',   color:'#659ad2', icon:'fas fa-code',     run:'sim'     },
    { id:'sh',    label:'Shell',      ext:'.sh',    color:'#4eaa25', icon:'fas fa-terminal', run:'sim'     },
    { id:'sql',   label:'SQL',        ext:'.sql',   color:'#e38c00', icon:'fas fa-database', run:'sim'     },
    { id:'xml',   label:'XML',        ext:'.xml',   color:'#f60',    icon:'fas fa-code',     run:'preview' },
];

let currentLang = LANGS[0];
let repoMediaFiles = []; // { name, type, dataUrl }

// ============================================================
//  INIT
// ============================================================
const editor = document.getElementById('main-editor');
const actionBtn = document.getElementById('action-btn');
const portal = document.getElementById('portal');

function initLangBar() {
    const bar = document.getElementById('langBar');
    bar.innerHTML = LANGS.map(l =>
        `<div class="lang-chip ${l.id === currentLang.id ? 'active' : ''}" onclick="setLang('${l.id}')">
            <i class="${l.icon}" style="margin-right:5px;color:${l.color};"></i>${l.label}
        </div>`
    ).join('');
}

function setLang(id) {
    currentLang = LANGS.find(l => l.id === id) || LANGS[0];
    initLangBar();
    document.getElementById('langBadge').textContent = currentLang.label;
    document.getElementById('ext-badge').textContent = currentLang.ext;
    // Show/hide run vs deploy based on lang
    const runBtn = document.getElementById('run-btn');
    runBtn.style.display = currentLang.run === 'preview' ? 'none' : '';
}

function getLangFromFile(filename) {
    const ext = '.' + filename.split('.').pop().toLowerCase();
    return LANGS.find(l => l.ext === ext) || LANGS[0];
}

// ============================================================
//  EDITOR
// ============================================================
function onEditorInput() {
    const lines = editor.value.split('\n').length;
    document.getElementById('lineCount').textContent = lines + ' line' + (lines !== 1 ? 's' : '');
    actionBtn.innerText = editor.value.trim() === '' ? 'Paste' : 'Clear';
}

async function handleAction() {
    if (editor.value.trim() === '') {
        try { editor.value = await navigator.clipboard.readText(); } catch { editor.focus(); }
    } else { editor.value = ''; }
    onEditorInput();
}

function handleFileUpload(input) {
    const file = input.files[0]; if (!file) return;
    const detectedLang = getLangFromFile(file.name);
    setLang(detectedLang.id);
    const reader = new FileReader();
    reader.onload = e => { editor.value = e.target.result; onEditorInput(); };
    reader.readAsText(file);
    input.value = '';
}

// ============================================================
//  RUN / COMPILE
// ============================================================
function runCode() {
    const code = editor.value.trim();
    if (!code) return;
    
    if (currentLang.run === 'preview') {
        deploy(); return;
    }
    if (currentLang.run === 'js') {
        runJS(code); return;
    }
    if (currentLang.run === 'json') {
        runJSON(code); return;
    }
    if (currentLang.run === 'md') {
        runMarkdown(code); return;
    }
    // sim for others
    simulateRun(code);
}

function setOutput(html) {
    document.getElementById('outputPanel').innerHTML = html;
    show('output', null);
    document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
}

function runJS(code) {
    const logs = [];
    const fakeConsole = {
        log: (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x,null,2) : String(x)).join(' ')),
        error: (...a) => logs.push('<span class="err">ERROR: ' + a.join(' ') + '</span>'),
        warn: (...a) => logs.push('<span style="color:var(--yellow)">WARN: ' + a.join(' ') + '</span>'),
    };
    try {
        const fn = new Function('console', code);
        fn(fakeConsole);
        setOutput(logs.length ? logs.join('\n') : '<span class="info">// No output (no console.log calls)</span>');
    } catch(e) {
        setOutput('<span class="err">RuntimeError: ' + e.message + '</span>');
    }
}

function runJSON(code) {
    try {
        const parsed = JSON.parse(code);
        setOutput('<span style="color:#aaa;">✓ Valid JSON</span>\n\n' + JSON.stringify(parsed, null, 2));
    } catch(e) {
        setOutput('<span class="err">JSON SyntaxError: ' + e.message + '</span>');
    }
}

function runMarkdown(code) {
    // Simple markdown → HTML
    const html = code
        .replace(/^### (.+)/gm, '<h3>$1</h3>')
        .replace(/^## (.+)/gm, '<h2>$1</h2>')
        .replace(/^# (.+)/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    const doc = document.getElementById('live-frame').contentDocument;
    doc.open(); doc.write('<style>body{font-family:sans-serif;padding:20px;line-height:1.7;}</style>' + html); doc.close();
    show('live', document.getElementById('tab-live'));
}

function simulateRun(code) {
    const lines = code.split('\n').length;
    setOutput(`<span class="info">// ${currentLang.label} Compiler — x0s Sandbox\n// ${lines} lines compiled\n// Note: ${currentLang.label} runs server-side; showing static analysis\n</span>\n<span style="color:#30d158;">✓ Syntax check passed (no parse errors detected)\n✓ Build: ${currentLang.label} • ${(new Date()).toLocaleTimeString()}</span>`);
}

function deploy() {
    const code = editor.value.trim();
    if (!code) return;
    let content = code;
    if (currentLang.id === 'css') {
        content = `<!DOCTYPE html><html><head><style>${code}</style></head><body><p style="color:#555;font-family:sans-serif;padding:20px;">CSS Preview — add HTML to see styled elements.</p></body></html>`;
    }
    ['live-frame','mobile-frame'].forEach(id => {
        const doc = document.getElementById(id).contentDocument;
        doc.open(); doc.write(content); doc.close();
    });
    show('live', document.getElementById('tab-live'));
}

// ============================================================
//  VIEWS
// ============================================================
function show(mode, btn) {
    document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('view-' + mode).classList.add('active');
    if (mode === 'history') loadHistory();
    if (mode === 'live' || mode === 'mobile') {
        const code = editor.value.trim();
        if (code) deploy();
    }
}

// ============================================================
//  SAVE
// ============================================================
function openPortal() {
    document.getElementById('ext-badge').textContent = currentLang.ext;
    portal.classList.add('show');
    setTimeout(() => document.getElementById('file-name').focus(), 100);
}
function closePortal() { portal.classList.remove('show'); }

function saveFile() {
    const rawName = document.getElementById('file-name').value.trim() || 'x0s_build';
    const name = rawName.replace(/\.[^.]+$/, ''); // strip any extension user typed
    const fullName = name + currentLang.ext;
    const content = editor.value;
    
    const history = JSON.parse(localStorage.getItem('x0s_history') || '[]');
    history.unshift({ name: fullName, content, lang: currentLang.id, date: new Date().toLocaleString(), size: content.length });
    localStorage.setItem('x0s_history', JSON.stringify(history));
    
    const blob = new Blob([content], { type: 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fullName; a.click();
    closePortal();
    showToast('Saved ' + fullName);
}

// ============================================================
//  HISTORY
// ============================================================
function langConfig(id) { return LANGS.find(l => l.id === id) || LANGS[0]; }

function loadHistory() {
    const list = document.getElementById('history-list');
    const history = JSON.parse(localStorage.getItem('x0s_history') || '[]');
    list.innerHTML = history.length ? '' : '<p style="opacity:0.12;text-align:center;margin-top:40px;font-size:0.85rem;">Log Clear</p>';
    history.forEach((item, index) => {
        const lc = langConfig(item.lang || 'html');
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
            <div class="hist-icon" style="background:${lc.color}22;color:${lc.color};">
                <i class="${lc.icon}"></i>
            </div>
            <div class="hist-info" style="cursor:pointer;" onclick="restoreHistory(${index})">
                <div class="hist-name">${item.name}</div>
                <div class="hist-meta">${item.date} · ${formatSize(item.size || 0)}</div>
            </div>
            <div class="hist-three-dot" onclick="openCtxMenu(event, ${index})">
                <i class="fa-solid fa-ellipsis"></i>
            </div>`;
        list.appendChild(div);
    });
}

function formatSize(bytes) {
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    return (bytes / 1024).toFixed(1) + ' KB';
}

function restoreHistory(index) {
    const history = JSON.parse(localStorage.getItem('x0s_history'));
    const item = history[index];
    editor.value = item.content;
    setLang(item.lang || 'html');
    onEditorInput();
    show('code', document.getElementById('tab-code'));
}

function deleteHistory(index) {
    const history = JSON.parse(localStorage.getItem('x0s_history'));
    history.splice(index, 1);
    localStorage.setItem('x0s_history', JSON.stringify(history));
    loadHistory();
    showToast('Build removed');
}

// ============================================================
//  CONTEXT MENU (three-dot)
// ============================================================
let ctxTarget = null;
function openCtxMenu(e, index) {
    e.stopPropagation();
    ctxTarget = index;
    const menu = document.getElementById('ctxMenu');
    const history = JSON.parse(localStorage.getItem('x0s_history') || '[]');
    const item = history[index];
    const lc = langConfig(item.lang || 'html');
    
    menu.innerHTML = `
        <div class="ctx-item" onclick="restoreHistory(${index}); closeCtx();">
            <i class="fa-solid fa-rotate-left" style="color:var(--blue);"></i> Restore to Editor
        </div>
        <div class="ctx-item" onclick="downloadFromHistory(${index}); closeCtx();">
            <i class="fa-solid fa-download" style="color:var(--green);"></i> Download File
        </div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" onclick="openRepoModal(${index}); closeCtx();">
            <i class="fa-solid fa-code-branch" style="color:var(--yellow);"></i> Add to Quick Repo
        </div>
        <div class="ctx-item" onclick="openNewRepoFrom(${index}); closeCtx();">
            <i class="fa-solid fa-folder-plus" style="color:#af52de;"></i> New Repo with this file
        </div>
        <div class="ctx-sep"></div>
        <div class="ctx-item danger" onclick="deleteHistory(${index}); closeCtx();">
            <i class="fa-solid fa-trash-can"></i> Delete Build
        </div>`;
    
    const rect = e.target.getBoundingClientRect();
    menu.style.display = 'block';
    menu.style.right = '16px';
    menu.style.left = 'auto';
    menu.style.top = Math.min(rect.bottom + 6, window.innerHeight - 260) + 'px';
    
    setTimeout(() => document.addEventListener('click', closeCtx, { once: true }), 50);
}

function closeCtx() {
    const m = document.getElementById('ctxMenu');
    m.style.display = 'none';
}

function downloadFromHistory(index) {
    const history = JSON.parse(localStorage.getItem('x0s_history'));
    const item = history[index];
    const blob = new Blob([item.content], { type: 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = item.name; a.click();
}

// ============================================================
//  QUICK REPO
// ============================================================
let activeRepos = JSON.parse(localStorage.getItem('x0s_repos') || '[]');
let repoPreselect = null;

function openRepoModal(preIndex = null) {
    repoPreselect = preIndex;
    repoMediaFiles = [];
    document.getElementById('repoMediaThumbs').innerHTML = '';
    document.getElementById('repoName').value = '';
    document.getElementById('repoDesc').value = '';
    
    // Populate file selector from history
    const history = JSON.parse(localStorage.getItem('x0s_history') || '[]');
    const sel = document.getElementById('fileSelector');
    sel.innerHTML = history.length ? '' : '<p style="color:#333;font-size:0.78rem;text-align:center;padding:10px;">No saved builds yet</p>';
    history.forEach((item, i) => {
        const lc = langConfig(item.lang || 'html');
        const preSelected = preIndex === i;
        const div = document.createElement('div');
        div.className = 'file-check-item' + (preSelected ? ' selected' : '');
        div.dataset.index = i;
        div.onclick = () => toggleFileSelect(div);
        div.innerHTML = `
            <div class="file-check-icon" style="background:${lc.color}22;color:${lc.color};"><i class="${lc.icon}"></i></div>
            <div class="file-check-name">${item.name}</div>
            <div class="file-check-cb">${preSelected ? '<i class="fa-solid fa-check" style="font-size:10px;color:#fff;"></i>' : ''}</div>`;
        sel.appendChild(div);
    });
    
    document.getElementById('repo-modal').classList.add('show');
}

function openNewRepoFrom(index) {
    openRepoModal(index);
}

function closeRepoModal() {
    document.getElementById('repo-modal').classList.remove('show');
}

function toggleFileSelect(div) {
    div.classList.toggle('selected');
    const cb = div.querySelector('.file-check-cb');
    if (div.classList.contains('selected')) {
        cb.innerHTML = '<i class="fa-solid fa-check" style="font-size:10px;color:#fff;"></i>';
    } else {
        cb.innerHTML = '';
    }
}

function handleRepoMedia(input) {
    const files = Array.from(input.files);
    files.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
            const obj = { name: file.name, type: file.type.startsWith('video') ? 'video' : 'image', dataUrl: e.target.result };
            repoMediaFiles.push(obj);
            renderMediaThumbs();
        };
        reader.readAsDataURL(file);
    });
    input.value = '';
}

function renderMediaThumbs() {
    const container = document.getElementById('repoMediaThumbs');
    container.innerHTML = '';
    repoMediaFiles.forEach((f, i) => {
        if (f.type === 'image') {
            const img = document.createElement('img');
            img.className = 'media-thumb';
            img.src = f.dataUrl;
            img.onclick = () => openMediaPreview(i, 'repo');
            container.appendChild(img);
        } else {
            const div = document.createElement('div');
            div.className = 'media-thumb-video';
            div.innerHTML = '<i class="fa-solid fa-play"></i>';
            div.onclick = () => openMediaPreview(i, 'repo');
            container.appendChild(div);
        }
    });
}

function createRepo() {
    const name = document.getElementById('repoName').value.trim();
    if (!name) { showToast('Enter a repo name'); return; }
    
    const selectedIndexes = [];
    document.querySelectorAll('.file-check-item.selected').forEach(el => {
        selectedIndexes.push(parseInt(el.dataset.index));
    });
    if (selectedIndexes.length === 0 && repoMediaFiles.length === 0) {
        showToast('Select at least one file or media');
        return;
    }
    
    const history = JSON.parse(localStorage.getItem('x0s_history') || '[]');
    const files = selectedIndexes.map(i => ({ ...history[i] }));
    
    const repo = {
        id: Date.now(),
        name,
        desc: document.getElementById('repoDesc').value.trim(),
        date: new Date().toLocaleString(),
        files,
        media: repoMediaFiles,
    };
    activeRepos.unshift(repo);
    localStorage.setItem('x0s_repos', JSON.stringify(activeRepos));
    closeRepoModal();
    showToast('Repo "' + name + '" created!');
    // Switch to history tab and show repos section
    show('history', document.getElementById('tab-history'));
}

// ============================================================
//  REPO VIEWER
// ============================================================
function openRepoViewer(repoId) {
    const repo = activeRepos.find(r => r.id === repoId);
    if (!repo) return;
    document.getElementById('repoViewName').textContent = repo.name;
    document.getElementById('repoViewDate').textContent = repo.date;
    
    // Stats
    const statsEl = document.getElementById('repoViewStats');
    statsEl.innerHTML = `
        <div class="repo-stat-chip"><i class="fa-solid fa-file-code"></i>${repo.files.length} file${repo.files.length !== 1 ? 's' : ''}</div>
        <div class="repo-stat-chip"><i class="fa-solid fa-photo-film"></i>${(repo.media || []).length} media</div>
        ${repo.desc ? `<div class="repo-stat-chip"><i class="fa-solid fa-align-left"></i>${repo.desc}</div>` : ''}`;
    
    const body = document.getElementById('repoViewBody');
    body.innerHTML = '';
    
    // Files
    if (repo.files.length) {
        const label = document.createElement('div');
        label.style.cssText = 'font-size:0.68rem;font-weight:700;letter-spacing:1.5px;color:#444;padding:0 4px;margin-bottom:4px;';
        label.textContent = 'SOURCE FILES';
        body.appendChild(label);
    }
    repo.files.forEach((file, fi) => {
        const lc = langConfig(file.lang || 'html');
        const entry = document.createElement('div');
        entry.className = 'repo-file-entry';
        entry.innerHTML = `
            <div class="repo-file-icon" style="background:${lc.color}22;color:${lc.color};"><i class="${lc.icon}"></i></div>
            <div class="repo-file-info">
                <div class="repo-file-name">${file.name}</div>
                <div class="repo-file-size">${formatSize(file.size || 0)} · ${file.date}</div>
            </div>
            <i class="fa-solid fa-arrow-down" style="color:#333;font-size:0.8rem;"></i>`;
        entry.onclick = () => {
            // Load to editor
            editor.value = file.content;
            setLang(file.lang || 'html');
            onEditorInput();
            closeRepoViewer();
            show('code', document.getElementById('tab-code'));
            showToast('Loaded ' + file.name);
        };
        body.appendChild(entry);
    });
    
    // Media
    if ((repo.media || []).length) {
        const label2 = document.createElement('div');
        label2.style.cssText = 'font-size:0.68rem;font-weight:700;letter-spacing:1.5px;color:#444;padding:8px 4px 4px;';
        label2.textContent = 'MEDIA';
        body.appendChild(label2);
        
        const grid = document.createElement('div');
        grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;';
        repo.media.forEach((m, mi) => {
            if (m.type === 'image') {
                const img = document.createElement('img');
                img.src = m.dataUrl;
                img.style.cssText = 'width:80px;height:80px;border-radius:14px;object-fit:cover;border:1px solid var(--border);cursor:pointer;';
                img.onclick = () => openMediaPreviewFromRepo(repo.id, mi);
                grid.appendChild(img);
            } else {
                const div = document.createElement('div');
                div.style.cssText = 'width:80px;height:80px;border-radius:14px;background:#111;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#555;cursor:pointer;font-size:1.4rem;';
                div.innerHTML = '<i class="fa-solid fa-play"></i>';
                div.onclick = () => openMediaPreviewFromRepo(repo.id, mi);
                grid.appendChild(div);
            }
        });
        body.appendChild(grid);
    }
    
    document.getElementById('repo-viewer').classList.add('show');
}

function closeRepoViewer() { document.getElementById('repo-viewer').classList.remove('show'); }

let repoMediaPreviewContext = null;
function openMediaPreviewFromRepo(repoId, mi) {
    const repo = activeRepos.find(r => r.id === repoId);
    if (!repo) return;
    const m = repo.media[mi];
    showMediaPreview(m);
}

function openMediaPreview(index, ctx) {
    const m = repoMediaFiles[index];
    showMediaPreview(m);
}

function showMediaPreview(m) {
    const img = document.getElementById('preview-img');
    const vid = document.getElementById('preview-vid');
    img.style.display = 'none';
    vid.style.display = 'none';
    if (m.type === 'image') { img.src = m.dataUrl; img.style.display = 'block'; }
    else { vid.src = m.dataUrl; vid.style.display = 'block'; }
    document.getElementById('preview-name').textContent = m.name;
    document.getElementById('media-preview').classList.add('show');
}

function closeMediaPreview() { document.getElementById('media-preview').classList.remove('show'); }

// ============================================================
//  HISTORY + REPOS COMBINED VIEW
// ============================================================
const _origLoadHistory = loadHistory;
function loadHistory() {
    const list = document.getElementById('history-list');
    const history = JSON.parse(localStorage.getItem('x0s_history') || '[]');
    activeRepos = JSON.parse(localStorage.getItem('x0s_repos') || '[]');
    list.innerHTML = '';
    
    // REPOS section
    if (activeRepos.length) {
        const repoLabel = document.createElement('div');
        repoLabel.style.cssText = 'font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:#333;padding:4px 4px 8px;';
        repoLabel.innerHTML = '<i class="fa-solid fa-code-branch" style="margin-right:6px;"></i>REPOSITORIES';
        list.appendChild(repoLabel);
        
        activeRepos.forEach(repo => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.style.borderColor = '#1e1e1e';
            div.innerHTML = `
                <div class="hist-icon" style="background:rgba(175,82,222,0.15);color:#af52de;">
                    <i class="fa-solid fa-code-branch"></i>
                </div>
                <div class="hist-info" style="cursor:pointer;" onclick="openRepoViewer(${repo.id})">
                    <div class="hist-name">${repo.name}</div>
                    <div class="hist-meta">${repo.files.length} files · ${(repo.media||[]).length} media · ${repo.date}</div>
                </div>
                <div class="hist-three-dot" onclick="deleteRepo(${repo.id})">
                    <i class="fa-solid fa-trash-can" style="color:var(--red);font-size:0.75rem;"></i>
                </div>`;
            list.appendChild(div);
        });
        
        const divider = document.createElement('div');
        divider.style.cssText = 'height:1px;background:var(--border);margin:8px 4px;';
        list.appendChild(divider);
    }
    
    // BUILDS section
    if (history.length) {
        const buildLabel = document.createElement('div');
        buildLabel.style.cssText = 'font-size:0.65rem;font-weight:700;letter-spacing:1.5px;color:#333;padding:4px 4px 8px;';
        buildLabel.innerHTML = '<i class="fa-solid fa-layer-group" style="margin-right:6px;"></i>BUILD HISTORY';
        list.appendChild(buildLabel);
    }
    
    history.forEach((item, index) => {
        const lc = langConfig(item.lang || 'html');
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
            <div class="hist-icon" style="background:${lc.color}22;color:${lc.color};">
                <i class="${lc.icon}"></i>
            </div>
            <div class="hist-info" style="cursor:pointer;" onclick="restoreHistory(${index})">
                <div class="hist-name">${item.name}</div>
                <div class="hist-meta">${item.date} · ${formatSize(item.size || 0)}</div>
            </div>
            <div class="hist-three-dot" onclick="openCtxMenu(event, ${index})">
                <i class="fa-solid fa-ellipsis"></i>
            </div>`;
        list.appendChild(div);
    });
    
    if (!history.length && !activeRepos.length) {
        list.innerHTML = '<p style="opacity:0.12;text-align:center;margin-top:40px;font-size:0.85rem;">Log Clear</p>';
    }
}

function deleteRepo(id) {
    activeRepos = activeRepos.filter(r => r.id !== id);
    localStorage.setItem('x0s_repos', JSON.stringify(activeRepos));
    loadHistory();
    showToast('Repo deleted');
}

// ============================================================
//  QUICK REPO from History Tab header button
// ============================================================
// Allow opening repo modal with no preselect
function newBlankRepo() { openRepoModal(null); }

// ============================================================
//  TOAST
// ============================================================
let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ============================================================
//  PHONE CLOCK
// ============================================================
function setTime() {
    const now = new Date();
    const el = document.getElementById('phone-time');
    if (el) el.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
setInterval(setTime, 1000); setTime();

initLangBar();
onEditorInput();
